<html lang="lt">
<head>

    <link rel="canonical" href="https://huntertest.lt/zodynas.html">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CNXX464ZS9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CNXX464ZS9');

    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forestBackground: '#0E110E',
                        forestPrimary: '#4CAF50',
                        forestSurface: '#2C2520',
                        forestSecondary: '#CBD5E1',
                        forestBorder: '#475569',
                        buttonBrown: '#6D4C41',
                        buttonBrownHover: '#8D6E63'
                    },
                    fontFamily: {
                        oswald: ['Oswald', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-forestBackground text-forestSecondary font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- 1. BENDRA VIRŠUTINĖ NAVIGACIJOS JUOSTA -->
    <nav class="bg-forestSurface border-b border-forestBorder py-2.5 px-4 md:px-6 flex justify-between items-center sticky top-0 z-50 shrink-0 shadow-md">
        <a href="/" class="font-oswald text-xl md:text-2xl font-bold tracking-wider text-forestPrimary">HUNTERTEST</a>
        
        <div class="flex items-center gap-2 md:gap-4">
            <a href="/zodynas.html" class="text-xs font-bold bg-forestPrimary/20 text-forestPrimary border border-forestPrimary/50 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5">
                <span>📖</span> <span>Žodynas</span>
            </a>
            <a href="/renginiai.html" class="text-xs font-bold text-forestSecondary hover:text-white bg-forestBackground/60 border border-forestBorder/60 hover:border-forestPrimary px-3 py-1.5 rounded-xl transition flex items-center gap-1.5">
                <span>📅</span> <span>Renginiai</span>
            </a>
            <a href="/" class="bg-forestPrimary hover:bg-green-600 text-white font-bold px-3.5 py-1.5 rounded-xl text-xs uppercase tracking-wider transition shadow flex items-center gap-1">
                <span>Spręsti testus</span> <span>→</span>
            </a>
        </div>
    </nav>

    <!-- 2. ŽODYNO TURINYS -->
    <main class="max-w-4xl w-full mx-auto p-4 md:p-6 space-y-4 flex-1">
        
        <!-- Žodyno antraštė su atgal mygtuku -->
        <div class="flex items-center gap-3 border-b border-forestBorder pb-3">
            <a href="/" class="w-9 h-9 rounded-xl bg-forestSurface border border-forestBorder hover:border-forestPrimary flex items-center justify-center text-white text-sm transition" title="Grįžti į pradžią">
                ←
            </a>
            <div>
                <h1 class="text-xl md:text-2xl font-bold font-oswald text-white uppercase tracking-wider">Medžiotojų žodynas</h1>
                <p id="terms-count" class="text-[11px] text-forestSecondary">Kraunama...</p>
            </div>
        </div>

        <!-- Paieškos laukas -->
        <div class="relative">
            <input id="search-input" type="text" placeholder="Ieškoti termino arba reikšmės..." 
                class="w-full h-11 bg-forestSurface border border-forestBorder focus:border-forestPrimary rounded-xl px-4 pl-10 pr-10 text-xs text-white placeholder-slate-500 focus:outline-none transition">
            <span class="absolute left-3.5 top-3.5 text-xs text-slate-500">🔍</span>
            <button id="clear-search" class="absolute right-3.5 top-3 text-xs text-slate-400 hover:text-white hidden">✕</button>
        </div>

        <!-- KATEGORIJŲ FILTRAI PER KELIAS EILUTES (FLEX-WRAP) -->
        <div id="categories-container" class="flex flex-wrap gap-2 pt-1 pb-1"></div>

        <!-- Sąrašas -->
        <div id="terms-list" class="space-y-2.5 pt-1">
            <div class="text-center py-10 text-slate-500 text-xs">Kraunamas žodynas...</div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-forestBorder/50 py-4 text-center text-[10px] text-slate-600 max-w-4xl mx-auto w-full px-4">
        <p>&copy; 2026 HunterTest.lt • <a href="/" class="hover:text-forestPrimary">Bandomasis medžioklės egzaminas</a></p>
    </footer>

    <script>
        let allTerms = [];
        let activeCategory = "Visi";
        let searchQuery = "";
        let expandedIds = new Set();

        async function init() {
            try {
                const res = await fetch('/assets/zodynas_lt.json');
                allTerms = await res.json();
                renderCategories();
                filterAndRender();
            } catch (e) {
                console.error("Klaida kraunant žodyną:", e);
            }
        }

        function renderCategories() {
            const categories = ["Visi", ...Array.from(new Set(allTerms.map(t => t.category)))];
            const container = document.getElementById('categories-container');
            
            container.innerHTML = categories.map(cat => {
                const isSelected = activeCategory === cat;
                const btnClass = isSelected 
                    ? 'bg-forestPrimary text-white border-forestPrimary shadow-md' 
                    : 'bg-forestSurface text-forestSecondary border-forestBorder hover:border-forestPrimary';
                return `<button class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-bold transition border ${btnClass}" data-cat="${cat}">${cat}</button>`;
            }).join('');

            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeCategory = btn.getAttribute('data-cat');
                    renderCategories();
                    filterAndRender();
                });
            });
        }

        function filterAndRender() {
            const filtered = allTerms.filter(item => {
                const matchesCat = activeCategory === "Visi" || item.category === activeCategory;
                const matchesSearch = searchQuery === "" || 
                    item.term.toLowerCase().includes(searchQuery) || 
                    item.explanation.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            document.getElementById('terms-count').innerText = `Rasta terminų: ${filtered.length}`;

            const listContainer = document.getElementById('terms-list');
            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="bg-forestSurface border border-forestBorder p-8 rounded-2xl text-center text-xs text-forestSecondary">Terminų pagal užklausą nerasta.</div>`;
                return;
            }

            listContainer.innerHTML = filtered.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const titleColor = isExpanded ? 'text-forestPrimary' : 'text-white';

                let expandedSection = "";
                if (isExpanded) {
                    const example = item.exampleSentence ? `<p class="text-forestPrimary italic">Pavyzdys: „${item.exampleSentence}“</p>` : "";
                    expandedSection = `
                        <div class="mt-3 pt-3 border-t border-forestBorder/70 space-y-2 text-xs leading-relaxed">
                            <p class="text-forestSecondary">${item.explanation}</p>
                            ${example}
                        </div>
                    `;
                }

                return `
                    <div class="term-card bg-forestSurface border border-forestBorder hover:border-forestPrimary/60 rounded-xl p-4 transition duration-200 cursor-pointer" data-id="${item.id}">
                        <div class="flex justify-between items-center gap-3">
                            <h2 class="text-sm md:text-base font-bold ${titleColor} transition">
                                ${item.term}
                            </h2>
                            <span class="text-[10px] font-bold text-forestSecondary bg-forestBackground px-2.5 py-1 rounded-md border border-forestBorder whitespace-nowrap">
                                ${item.category}
                            </span>
                        </div>
                        ${expandedSection}
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.term-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = parseInt(card.getAttribute('data-id'));
                    if (expandedIds.has(id)) {
                        expandedIds.delete(id);
                    } else {
                        expandedIds.add(id);
                    }
                    filterAndRender();
                });
            });
        }

        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-search');

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            clearBtn.classList.toggle('hidden', searchQuery === "");
            filterAndRender();
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = "";
            searchQuery = "";
            clearBtn.classList.add('hidden');
            filterAndRender();
        });

        init();
    </script>
</body>
</html>
