<!DOCTYPE html>
<html lang="lt">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VL3LERY03T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VL3LERY03T');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medžiotojų žodynas ir terminai | HunterTest.lt</title>
    <meta name="description" content="Išsamus tradicinis medžiotojų žodynas, žargonas, žvėrių anatomijos ir elgsenos terminai.">
    <link rel="canonical" href="https://huntertest.lt/zodynas.html">

    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forestBackground: '#0E110E',
                        forestPrimary: '#4CAF50',
                        forestSurface: '#2C2520',
                        forestSecondary: '#CBD5E1',
                        forestBorder: '#475569',
                        buttonBrown: '#6D4C41',
                        buttonBrownHover: '#8D6E63'
                    },
                    fontFamily: {
                        oswald: ['Oswald', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-forestBackground text-forestSecondary font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- 1. BENDRAS MENIU -->
    <div id="global-navbar"></div>
    <script src="/js/navbar.js"></script>

    <!-- 2. PAGRINDINIS TURINYS -->
    <main class="max-w-4xl w-full mx-auto p-4 md:p-6 space-y-4 flex-1">
        
        <div class="flex items-center gap-3 border-b border-forestBorder pb-3">
            <a href="/" class="w-9 h-9 rounded-xl bg-forestSurface border border-forestBorder hover:border-forestPrimary flex items-center justify-center text-white text-sm transition shrink-0" title="Grįžti į pradžią">
                ←
            </a>
            <div>
                <h1 class="text-xl md:text-2xl font-bold font-oswald text-white uppercase tracking-wider leading-tight">
                    Medžiotojų žodynas
                </h1>
                <p id="zodynas-count" class="text-[11px] text-forestSecondary">Kraunama...</p>
            </div>
        </div>

        <!-- BENDRAS PAIEŠKOS IR FILTRŲ KOMPONENTAS -->
        <div id="zodynas-filter-component"></div>

        <!-- Sąrašas -->
        <div id="zodynas-list" class="space-y-2.5 pt-1">
            <div class="text-center py-10 text-slate-500 text-xs">Kraunamas žodynas iš JSON...</div>
        </div>

    </main>

    <footer class="border-t border-forestBorder/50 py-4 text-center text-[10px] text-slate-600 max-w-4xl mx-auto w-full px-4">
        <p>&copy; 2026 HunterTest.lt • <a href="/" class="hover:text-forestPrimary">Bandomasis medžioklės egzaminas</a></p>
    </footer>

    <!-- Modulio importas -->
    <script type="module">
        import { createSearchFilter } from '/js/components/searchFilter.js';

        let allTerms = [];
        let searchQuery = "";
        let selectedCategory = "Visi";
        let expandedIds = new Set();

        async function init() {
            try {
                const res = await fetch('/assets/zodynas_lt.json');
                allTerms = await res.json();
                
                const categories = ["Visi", ...Array.from(new Set(allTerms.map(t => t.category)))];

                createSearchFilter({
                    container: document.getElementById('zodynas-filter-component'),
                    placeholder: "Ieškoti termino arba reikšmės (pvz., ožys, šūvis, laika)...",
                    categories: categories,
                    initialCategory: selectedCategory,
                    onFilterChange: ({ query, category }) => {
                        searchQuery = query;
                        selectedCategory = category;
                        renderList();
                    }
                });

                renderList();
            } catch (e) {
                console.error("Klaida:", e);
            }
        }

        function renderList() {
            const filtered = allTerms.filter(item => {
                const matchesCategory = selectedCategory === "Visi" || item.category === selectedCategory;
                const matchesSearch = searchQuery === "" ||
                    item.term.toLowerCase().includes(searchQuery) ||
                    item.explanation.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            document.getElementById('zodynas-count').innerText = `Rasta terminų: ${filtered.length}`;
            const container = document.getElementById('zodynas-list');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-forestSurface border border-forestBorder p-8 rounded-2xl text-center text-xs text-forestSecondary">
                        Terminų pagal užklausą nerasta.
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const titleColor = isExpanded ? 'text-forestPrimary' : 'text-white';
                
                let expandedHtml = "";
                if (isExpanded) {
                    const example = item.exampleSentence 
                        ? `<p class="text-forestPrimary italic">Pavyzdys: „${item.exampleSentence}“</p>` 
                        : "";
                    expandedHtml = `
                        <div class="mt-3 pt-3 border-t border-forestBorder/70 space-y-2 text-xs leading-relaxed">
                            <p class="text-forestSecondary">${item.explanation}</p>
                            ${example}
                        </div>
                    `;
                }

                return `
                    <div class="term-card bg-forestSurface border border-forestBorder hover:border-forestPrimary/60 rounded-xl p-4 transition duration-200 cursor-pointer select-none" data-id="${item.id}">
                        <div class="flex justify-between items-center gap-3">
                            <h2 class="text-sm md:text-base font-bold ${titleColor} transition">
                                ${item.term}
                            </h2>
                            <span class="text-[10px] font-bold text-forestSecondary bg-forestBackground px-2.5 py-1 rounded-md border border-forestBorder whitespace-nowrap">
                                ${item.category}
                            </span>
                        </div>
                        ${expandedHtml}
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.term-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = parseInt(card.getAttribute('data-id'));
                    if (expandedIds.has(id)) {
                        expandedIds.delete(id);
                    } else {
                        expandedIds.add(id);
                    }
                    renderList();
                });
            });
        }

        init();
    </script>
</body>
</html>
