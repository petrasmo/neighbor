<!DOCTYPE html>
<html lang="lt">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VL3LERY03T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VL3LERY03T');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ką dabar galima medžioti ir žvejoti? Terminai | HunterTest.lt</title>
    <meta name="description" content="Interaktyvus medžioklės, žvejybos ir vėžiavimo terminų kalendorius pagal LR Medžioklės ir Mėgėjų žvejybos taisykles.">
    <link rel="canonical" href="https://huntertest.lt/kalendorius.html">

    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forestBackground: '#0E110E',
                        forestPrimary: '#4CAF50',
                        forestSurface: '#2C2520',
                        forestSecondary: '#CBD5E1',
                        forestBorder: '#475569',
                        buttonBrown: '#6D4C41',
                        buttonBrownHover: '#8D6E63'
                    },
                    fontFamily: {
                        oswald: ['Oswald', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-forestBackground text-forestSecondary font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- 1. BENDRAS MENIU -->
    <div id="global-navbar"></div>
    <script src="/js/navbar.js"></script>

    <!-- 2. PAGRINDINIS TURINYS -->
    <main class="max-w-4xl w-full mx-auto p-4 md:p-6 space-y-4 flex-1">
        
        <div class="flex items-center gap-3 border-b border-forestBorder pb-3">
            <a href="/" class="w-9 h-9 rounded-xl bg-forestSurface border border-forestBorder hover:border-forestPrimary flex items-center justify-center text-white text-sm transition shrink-0" title="Grįžti į pradžią">
                ←
            </a>
            <div>
                <h1 class="text-xl md:text-2xl font-bold font-oswald text-white uppercase tracking-wider leading-tight">
                    Ką dabar galima medžioti ir žvejoti?
                </h1>
                <p id="today-stats" class="text-[11px] text-forestPrimary font-bold">Kraunama...</p>
            </div>
        </div>

        <!-- Paieška -->
        <div class="relative">
            <input id="seasons-search" type="text" placeholder="Ieškoti žvėries, paukščio, žuvies, vėžio..." 
                class="w-full h-11 bg-forestSurface border border-forestBorder focus:border-forestPrimary rounded-xl px-4 pl-10 pr-10 text-xs text-white placeholder-slate-500 focus:outline-none transition">
            <span class="absolute left-3.5 top-3.5 text-xs text-slate-500">🔍</span>
            <button id="clear-search" class="absolute right-3.5 top-3 text-xs text-slate-400 hover:text-white hidden">✕</button>
        </div>

        <!-- KATEGORIJŲ MYGTUKAI (FLEX-WRAP: SUSIDĖLIOJA Į KELIAS EILUTES KAIP ŽODYNE) -->
        <div id="seasons-categories" class="flex flex-wrap gap-2 pt-1"></div>

        <!-- Sąrašas -->
        <div id="seasons-list" class="space-y-3 pt-1">
            <div class="text-center py-10 text-slate-500 text-xs">Kraunami terminai iš JSON...</div>
        </div>

    </main>

    <footer class="border-t border-forestBorder/50 py-4 text-center text-[10px] text-slate-600 max-w-4xl mx-auto w-full px-4">
        <p>&copy; 2026 HunterTest.lt • <a href="/" class="hover:text-forestPrimary">Bandomasis medžioklės egzaminas</a></p>
    </footer>

    <script>
        const MONTH_NAMES = ['Sausio', 'Vasario', 'Kovo', 'Balandžio', 'Gegužės', 'Birželio', 'Liepos', 'Rugpjūčio', 'Rugsėjo', 'Spalio', 'Lapkričio', 'Gruodžio'];
        let seasonsData = [];
        let activeCat = "Visi";
        let searchQuery = "";

        async function loadSeasonsData() {
            try {
                const response = await fetch('/assets/medziokles_terminai_lt.json');
                if (!response.ok) throw new Error("HTTP klaida: " + response.status);
                seasonsData = await response.json();
                renderCategories();
                renderList();
            } catch (e) {
                console.error("Klaida nuskaitant JSON:", e);
                document.getElementById('seasons-list').innerHTML = `
                    <div class="bg-red-950/20 border border-red-900/50 p-6 rounded-2xl text-center text-xs text-red-400">
                        Nepavyko užkrauti terminų failo iš /assets/medziokles_terminai_lt.json.
                    </div>
                `;
            }
        }

        function checkStatus(item, today) {
            if (item.allYear) return { isOpen: true, isAllYear: true, daysText: "Neribojama" };

            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth() + 1;

            let startDate, endDate;
            if (item.startMonth > item.endMonth) {
                if (currentMonth >= item.startMonth) {
                    startDate = new Date(currentYear, item.startMonth - 1, item.startDay);
                    endDate = new Date(currentYear + 1, item.endMonth - 1, item.endDay, 23, 59, 59);
                } else {
                    startDate = new Date(currentYear - 1, item.startMonth - 1, item.startDay);
                    endDate = new Date(currentYear, item.endMonth - 1, item.endDay, 23, 59, 59);
                }
            } else {
                startDate = new Date(currentYear, item.startMonth - 1, item.startDay);
                endDate = new Date(currentYear, item.endMonth - 1, item.endDay, 23, 59, 59);
            }

            const isOpen = (today >= startDate && today <= endDate);
            if (isOpen) {
                const diffTime = endDate - today;
                const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return { isOpen: true, isAllYear: false, daysText: `Liko ${daysLeft} d. (iki ${MONTH_NAMES[item.endMonth - 1]} ${item.endDay} d.)` };
            } else {
                let nextStart = new Date(currentYear, item.startMonth - 1, item.startDay);
                if (today > nextStart) nextStart = new Date(currentYear + 1, item.startMonth - 1, item.startDay);
                const diffTime = nextStart - today;
                const daysToStart = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return { isOpen: false, isAllYear: false, daysText: `Prasidės po ${daysToStart} d. (${MONTH_NAMES[item.startMonth - 1]} ${item.startDay} d.)` };
            }
        }

        // KATEGORIJŲ GENERAVIMAS SU WRAP (KELIOMIS EILUTĖMIS)
        function renderCategories() {
            const rawCategories = Array.from(new Set(seasonsData.map(i => i.category).filter(Boolean)));
            const categories = ["Visi", "🟢 Leidžiama šiandien", "Ištisus metus", ...rawCategories];
            const container = document.getElementById('seasons-categories');
            
            container.innerHTML = categories.map(cat => {
                const isSelected = activeCat === cat;
                const btnClass = isSelected 
                    ? 'bg-forestPrimary text-white border-forestPrimary shadow-md' 
                    : 'bg-forestSurface text-forestSecondary border-forestBorder hover:border-forestPrimary';
                return `<button class="cat-btn px-3.5 py-2 rounded-xl text-xs font-bold transition border ${btnClass}" data-cat="${cat}">${cat}</button>`;
            }).join('');

            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeCat = btn.getAttribute('data-cat');
                    renderCategories();
                    renderList();
                });
            });
        }

        function renderList() {
            const today = new Date();
            let openCount = 0;

            seasonsData.forEach(item => {
                if (checkStatus(item, today).isOpen) openCount++;
            });

            document.getElementById('today-stats').innerText = `Šiandien leidžiama: ${openCount} rūšių`;

            const filtered = seasonsData.filter(item => {
                const status = checkStatus(item, today);
                const matchesSearch = searchQuery === "" ||
                    item.name.toLowerCase().includes(searchQuery) ||
                    item.category.toLowerCase().includes(searchQuery) ||
                    (item.notes && item.notes.toLowerCase().includes(searchQuery));

                if (!matchesSearch) return false;
                if (activeCat === "Visi") return true;
                if (activeCat === "🟢 Leidžiama šiandien") return status.isOpen;
                if (activeCat === "Ištisus metus") return item.allYear === true;
                return item.category === activeCat;
            });

            const container = document.getElementById('seasons-list');
            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-forestSurface border border-forestBorder p-8 rounded-2xl text-center text-xs text-forestSecondary">Rūšių pagal pasirinktus kriterijus nerasta.</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const status = checkStatus(item, today);
                let badgeHtml = '';
                if (status.isAllYear) {
                    badgeHtml = `<span class="bg-blue-950/40 border border-blue-500/50 text-blue-400 px-2.5 py-0.5 rounded-lg text-[11px] font-bold font-oswald uppercase">Ištisus metus</span>`;
                } else if (status.isOpen) {
                    badgeHtml = `<span class="bg-green-950/40 border border-green-500/50 text-green-400 px-2.5 py-0.5 rounded-lg text-[11px] font-bold font-oswald uppercase">LEIDŽIAMA</span>`;
                } else {
                    badgeHtml = `<span class="bg-red-950/40 border border-red-500/50 text-red-400 px-2.5 py-0.5 rounded-lg text-[11px] font-bold font-oswald uppercase">DRAUDŽIAMA</span>`;
                }

                const seasonText = item.allYear 
                    ? "Ištisus metus" 
                    : `${MONTH_NAMES[item.startMonth - 1]} ${item.startDay} d. – ${MONTH_NAMES[item.endMonth - 1]} ${item.endDay} d.`;

                const icon = item.category === "Žuvys" ? "🎣" : item.category === "Vėžiai" ? "🦞" : "🏹";

                return `
                    <div class="bg-forestSurface border border-forestBorder hover:border-forestPrimary/60 rounded-2xl p-4 transition duration-200 space-y-3">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                            <div>
                                <h2 class="text-sm sm:text-base font-bold text-white font-oswald uppercase tracking-tight">
                                    ${item.name}
                                </h2>
                                <p class="text-xs text-forestSecondary">
                                    📅 Sezonas: <strong class="text-white">${seasonText}</strong>
                                </p>
                            </div>
                            <div class="flex flex-col items-start sm:items-end gap-1">
                                ${badgeHtml}
                                <span class="text-[11px] text-forestSecondary">${status.daysText}</span>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-forestBorder/60 flex flex-wrap justify-between items-center gap-2 text-xs">
                            <span class="text-forestPrimary bg-forestBackground px-2.5 py-1 rounded-md border border-forestBorder text-[11px]">
                                ${icon} Būdai: ${item.methods}
                            </span>
                            <span class="text-slate-400 text-[11px] italic">
                                ℹ️ ${item.notes}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        const sInput = document.getElementById('seasons-search');
        const sClear = document.getElementById('clear-search');

        sInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            sClear.classList.toggle('hidden', searchQuery === "");
            renderList();
        });

        sClear.addEventListener('click', () => {
            sInput.value = "";
            searchQuery = "";
            sClear.classList.add('hidden');
            renderList();
        });

        loadSeasonsData();
    </script>
</body>
</html>
