<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>JurgisAgro 🚜 – Skaitmeninis Ūkininko Portalas ir Pagalbos Tinklas</title>
    <meta name="description" content="JurgisAgro – modernus Lietuvos ūkininkų portalas: SOS technikos pagalba, grūdų supirkimo kainos, laukų žemėlapis, NMA žurnalai ir agro-orai.">
    <link rel="icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tractorBg: 'var(--bg-main)',
                        tractorPrimary: '#2E7D32',
                        tractorPrimaryLight: '#4CAF50',
                        tractorPrimaryHover: '#1B5E20',
                        tractorSurface: 'var(--bg-surface)',
                        tractorCard: 'var(--bg-card)',
                        tractorSecondary: 'var(--text-muted)',
                        tractorBorder: 'var(--border-color)',
                        myPostBg: 'var(--bg-highlight)'
                    },
                    fontFamily: {
                        oswald: ['Oswald', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 🌙 Tamsi tema (Default) */
        :root {
            --bg-main: #0F120F;
            --bg-surface: #181C18;
            --bg-card: #212621;
            --bg-highlight: #182C1A;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --border-color: #2E382E;
        }

        /* ☀️ Šviesi tema (Su giliu kontrastu ir ryškiais tekstais) */
        html.light-theme {
            --bg-main: #F1F5F1;
            --bg-surface: #FFFFFF;
            --bg-card: #F8FAF8;
            --bg-highlight: #E8F5E9;
            --text-main: #0F172A;
            --text-muted: #1E293B;
            --border-color: #CBD5E1;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* ☀️ ŠVIESIOS TEMOS TEKSTŲ IR LOGOTIPO KONTRASTAS */
        html.light-theme .text-white,
        html.light-theme h1,
        html.light-theme h2,
        html.light-theme h3,
        html.light-theme h4,
        html.light-theme .font-oswald {
            color: #0F172A !important;
        }

        html.light-theme .text-slate-200,
        html.light-theme .text-slate-300,
        html.light-theme .text-slate-400 {
            color: #1E293B !important;
        }

        /* Pataisytas JURGISAGRO logotipas šoniniame meniu */
        html.light-theme #global-sidebar a span.text-white,
        html.light-theme #global-mobile-header a span {
            color: #0F172A !important;
        }

        html.light-theme .bg-tractorBg,
        html.light-theme button.bg-tractorBg,
        html.light-theme a.bg-tractorBg {
            background-color: #F1F5F9 !important;
            color: #0F172A !important;
            border-color: #CBD5E1 !important;
        }

        html.light-theme button.bg-tractorBg:hover,
        html.light-theme a.bg-tractorBg:hover {
            background-color: #E2E8F0 !important;
            color: #000000 !important;
        }

        html.light-theme .bg-tractorSurface {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        html.light-theme input,
        html.light-theme select,
        html.light-theme textarea {
            background-color: #FFFFFF !important;
            color: #0F172A !important;
            border-color: #CBD5E1 !important;
        }

        html.light-theme .cs-dropdown {
            background-color: #FFFFFF !important;
            border-color: #CBD5E1 !important;
        }

        html.light-theme .cs-item {
            color: #0F172A !important;
        }

        html.light-theme .cs-item:hover {
            background-color: #E8F5E9 !important;
        }

        /* Orų kortelės šviesioje temoje */
        html.light-theme .bg-myPostBg {
            background-color: #E8F5E9 !important;
            border-color: #2E7D32 !important;
        }

        html.light-theme .bg-myPostBg .text-white {
            color: #0F172A !important;
        }

        /* 🌟 PARYŠKINTI ŽALI MYGTUKAI */
        .bg-tractorPrimary,
        button.bg-tractorPrimary,
        a.bg-tractorPrimary {
            background-color: #2E7D32 !important;
            color: #FFFFFF !important;
            font-weight: 800 !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35) !important;
            box-shadow: 0 4px 14px rgba(46, 125, 50, 0.3) !important;
        }

        .bg-tractorPrimary:hover,
        button.bg-tractorPrimary:hover,
        a.bg-tractorPrimary:hover {
            background-color: #1B5E20 !important;
            color: #FFFFFF !important;
        }

        .bg-tractorPrimary *,
        button.bg-tractorPrimary *,
        a.bg-tractorPrimary * {
            color: #FFFFFF !important;
            font-weight: 800 !important;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2E7D32; }
    </style>
</head>
<body class="font-sans antialiased h-[100dvh] w-screen overflow-hidden flex flex-col">

    <!-- 0. PRELOADERIS -->
    <div id="app-preloader" class="fixed inset-0 bg-tractorBg z-[200] flex flex-col items-center justify-center space-y-4 transition-opacity duration-300">
        <div class="relative flex items-center justify-center">
            <div class="w-16 h-16 rounded-full border-4 border-tractorBorder border-t-tractorPrimaryLight animate-spin"></div>
            <span class="text-3xl absolute">🚜</span>
        </div>
        <div class="text-center space-y-1">
            <h2 class="font-oswald text-2xl font-bold tracking-widest text-tractorPrimaryLight uppercase">JURGISAGRO</h2>
            <p class="text-xs text-slate-400 font-medium animate-pulse">Kraunamas ūkininkų portalas...</p>
        </div>
    </div>

    <!-- PAGRINDINIS PORTALAS -->
    <div class="flex flex-col md:flex-row h-full w-full overflow-hidden">
        
        <div id="global-mobile-header"></div>
        <div id="global-sidebar" class="h-full"></div>

        <main class="flex-1 h-full overflow-y-auto px-6 md:px-12 py-8 w-full">
            <div class="max-w-6xl mx-auto w-full space-y-6">
                <section id="view-tab-feed" class="tab-view space-y-6"></section>
                <section id="view-tab-weather" class="tab-view space-y-6 hidden"></section>
                <section id="view-tab-fields" class="tab-view space-y-6 hidden"></section>
                <section id="view-tab-reports" class="tab-view space-y-6 hidden"></section>
                <section id="view-tab-garage" class="tab-view space-y-6 hidden"></section>
                <section id="view-tab-settings" class="tab-view space-y-6 hidden"></section>

                <footer class="text-center text-xs text-slate-400 pt-8 pb-4 border-t border-tractorBorder/50 mt-12">
                    <p>&copy; 2026 JurgisAgro.com • Sukurta: <a href="https://petrasmo.com" target="_blank" class="hover:text-green-400 font-bold underline decoration-slate-600">Petrasmo Studios</a></p>
                </footer>
            </div>
        </main>

        <div id="global-mobile-nav"></div>

    </div>

    <!-- 5. DIALOGAS -->
    <div id="custom-dialog" class="fixed inset-0 bg-black/80 flex items-center justify-center z-[120] hidden p-4 backdrop-blur-sm">
        <div class="bg-tractorSurface border border-tractorBorder p-6 rounded-2xl max-w-sm w-full text-center space-y-4 shadow-2xl">
            <span id="dialog-icon" class="text-4xl block">⚠️</span>
            <h3 id="dialog-title" class="font-oswald text-xl font-bold uppercase tracking-wider text-white">Dėmesio</h3>
            <p id="dialog-message" class="text-xs leading-relaxed text-slate-300"></p>
            <div class="flex gap-3 pt-2">
                <button id="dialog-cancel-btn" class="flex-1 h-10 bg-tractorBg border border-tractorBorder text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition hidden">Atšaukti</button>
                <button id="dialog-confirm-btn" class="flex-1 h-10 bg-tractorPrimary hover:bg-tractorPrimaryHover text-white font-bold rounded-xl text-xs transition">Gerai</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
