<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Neighbor P.M. 🚜 – Tavo technika kaimynų pagalbai</title>
    <meta name="description" content="Žemės ūkio technikos dalijimosi, laukų valdymo ir SOS pagalbos platforma Lietuvos ūkininkams.">
    <link rel="icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tractorBg: '#0F120F',
                        tractorPrimary: '#2E7D32',
                        tractorPrimaryLight: '#4CAF50',
                        tractorPrimaryHover: '#1B5E20',
                        tractorSurface: '#181C18',
                        tractorCard: '#212621',
                        tractorSecondary: '#94A3B8',
                        tractorBorder: '#2E382E',
                        myPostBg: '#182C1A'
                    },
                    fontFamily: {
                        oswald: ['Oswald', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0F120F; }
        ::-webkit-scrollbar-thumb { background: #2E382E; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2E7D32; }
    </style>
</head>
<body class="bg-tractorBg text-slate-200 font-sans antialiased h-[100dvh] w-screen overflow-hidden flex flex-col">

    <!-- 0. PRELOADERIS -->
    <div id="app-preloader" class="fixed inset-0 bg-tractorBg z-[200] flex flex-col items-center justify-center space-y-4 transition-opacity duration-300">
        <div class="relative flex items-center justify-center">
            <div class="w-16 h-16 rounded-full border-4 border-tractorBorder border-t-tractorPrimaryLight animate-spin"></div>
            <span class="text-3xl absolute">🚜</span>
        </div>
        <div class="text-center space-y-1">
            <h2 class="font-oswald text-2xl font-bold tracking-widest text-tractorPrimaryLight uppercase">NEIGHBOR P.M.</h2>
            <p class="text-xs text-slate-400 font-medium animate-pulse">Kraunamas ūkininkų portalas...</p>
        </div>
    </div>

    <!-- PAGRINDINIS PORTALAS -->
    <div class="flex flex-col md:flex-row h-full w-full overflow-hidden">
        
        <!-- 1. Mobili viršutinė juosta -->
        <div class="md:hidden bg-tractorSurface border-b border-tractorBorder w-full px-4 py-3 flex justify-between items-center z-10 shrink-0">
            <div class="flex items-center gap-2">
                <span class="text-xl">🚜</span>
                <span class="font-oswald text-lg font-bold tracking-wider text-tractorPrimaryLight">NEIGHBOR P.M.</span>
            </div>
            <div id="auth-status-mobile">
                <button class="login-trigger-btn px-3 py-1 bg-tractorPrimary text-white rounded-lg text-xs font-bold">
                    Prisijungti
                </button>
            </div>
        </div>

        <!-- 2. Šoninis meniu (Desktop) - 5 ŠVARŪS PUNKTAI -->
        <aside class="hidden md:flex flex-col justify-between w-72 bg-tractorSurface border-r border-tractorBorder p-6 h-full shrink-0">
            <div class="space-y-6">
                <div class="flex items-center gap-3 border-b border-tractorBorder/70 pb-5">
                    <div class="w-10 h-10 rounded-xl bg-tractorPrimary/20 border border-tractorPrimary/40 flex items-center justify-center text-xl">
                        🚜
                    </div>
                    <div>
                        <span class="font-oswald text-xl font-bold tracking-wider text-white block">NEIGHBOR P.M.</span>
                        <span class="text-[10px] text-tractorPrimaryLight font-semibold uppercase tracking-widest">Ūkininkų portalas</span>
                    </div>
                </div>
                
                <nav class="space-y-2">
                    <button class="nav-tab-btn w-full text-left px-4 py-3.5 rounded-xl font-semibold text-sm transition flex items-center gap-3.5 cursor-pointer bg-tractorPrimary text-white shadow" data-tab="0">
                        <span class="text-lg">🚨</span> <span>SOS Skelbimai</span>
                    </button>
                    <button class="nav-tab-btn w-full text-left px-4 py-3.5 rounded-xl font-semibold text-sm transition flex items-center gap-3.5 cursor-pointer text-slate-400 hover:text-white" data-tab="1">
                        <span class="text-lg">🗺️</span> <span>Mano laukai</span>
                    </button>
                    <button class="nav-tab-btn w-full text-left px-4 py-3.5 rounded-xl font-semibold text-sm transition flex items-center gap-3.5 cursor-pointer text-slate-400 hover:text-white" data-tab="4">
                        <span class="text-lg">📄</span> <span>Ataskaitos</span>
                    </button>
                    <a href="grudai.html" class="w-full text-left px-4 py-3.5 rounded-xl font-semibold text-sm transition flex items-center gap-3.5 text-green-400 bg-tractorPrimary/10 border border-tractorPrimary/30 hover:bg-tractorPrimary/20">
                        <span class="text-lg">🌾</span> <span>Grūdų skaičiuoklė</span>
                    </a>
                    <button class="nav-tab-btn w-full text-left px-4 py-3.5 rounded-xl font-semibold text-sm transition flex items-center gap-3.5 cursor-pointer text-slate-400 hover:text-white" data-tab="2">
                        <span class="text-lg">🔧</span> <span>Mano technika</span>
                    </button>
                    <button class="nav-tab-btn w-full text-left px-4 py-3.5 rounded-xl font-semibold text-sm transition flex items-center gap-3.5 cursor-pointer text-slate-400 hover:text-white" data-tab="3">
                        <span class="text-lg">⚙️</span> <span>Nustatymai</span>
                    </button>
                </nav>
            </div>

            <div class="border-t border-tractorBorder/70 pt-4 space-y-3">
                <button id="help-btn-desktop" class="w-full py-2.5 bg-tractorBg hover:bg-tractorCard border border-tractorBorder rounded-xl text-xs font-semibold text-slate-300 flex items-center justify-center gap-2 transition">
                    <span>📖</span> <span>Naudojimosi gidas</span>
                </button>
                <div id="auth-sidebar-box" class="bg-tractorBg border border-tractorBorder/60 p-3.5 rounded-xl text-center space-y-2">
                    <p class="text-[11px] text-slate-400">Esate neprisijungęs</p>
                    <button class="login-trigger-btn w-full py-2 bg-tractorPrimary hover:bg-tractorPrimaryHover text-white text-xs font-bold rounded-lg shadow transition">
                        Prisijungti su Google
                    </button>
                </div>
            </div>
        </aside>

        <!-- 3. Pagrindinis turinys -->
        <main class="flex-1 h-full overflow-y-auto px-6 md:px-12 py-8 w-full">
            <div class="max-w-6xl mx-auto w-full space-y-6">
                <!-- TAB 0: SOS Skelbimai -->
                <section id="view-tab-feed" class="tab-view space-y-6"></section>
                
                <!-- TAB 1: Mano laukai -->
                <section id="view-tab-fields" class="tab-view space-y-6 hidden"></section>
                
                <!-- TAB 4: Ataskaitos (NAUJAS!) -->
                <section id="view-tab-reports" class="tab-view space-y-6 hidden"></section>
                
                <!-- TAB 2: Mano technika -->
                <section id="view-tab-garage" class="tab-view space-y-6 hidden"></section>
                
                <!-- TAB 3: Nustatymai -->
                <section id="view-tab-settings" class="tab-view space-y-6 hidden"></section>
            </div>
        </main>

        <!-- 4. Mobili navigacija -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-tractorSurface border-t border-tractorBorder h-16 flex justify-around items-center z-50">
            <button class="nav-tab-btn flex flex-col items-center justify-center w-14 h-full text-xs text-white bg-tractorPrimary" data-tab="0">
                <span class="text-base">🚨</span>
                <span class="mt-0.5 font-bold text-[10px]">Skelbimai</span>
            </button>
            <button class="nav-tab-btn flex flex-col items-center justify-center w-14 h-full text-xs text-slate-400" data-tab="1">
                <span class="text-base">🗺️</span>
                <span class="mt-0.5 font-bold text-[10px]">Laukai</span>
            </button>
            <button class="nav-tab-btn flex flex-col items-center justify-center w-14 h-full text-xs text-slate-400" data-tab="4">
                <span class="text-base">📄</span>
                <span class="mt-0.5 font-bold text-[10px]">Ataskaitos</span>
            </button>
            <a href="grudai.html" class="flex flex-col items-center justify-center w-14 h-full text-xs text-green-400">
                <span class="text-base">🌾</span>
                <span class="mt-0.5 font-bold text-[10px]">Grūdai</span>
            </a>
            <button class="nav-tab-btn flex flex-col items-center justify-center w-14 h-full text-xs text-slate-400" data-tab="3">
                <span class="text-base">⚙️</span>
                <span class="mt-0.5 font-bold text-[10px]">Profilis</span>
            </button>
        </nav>

    </div>

    <!-- 5. DIALOGAS -->
    <div id="custom-dialog" class="fixed inset-0 bg-black/80 flex items-center justify-center z-[120] hidden p-4 backdrop-blur-sm">
        <div class="bg-tractorSurface border border-tractorBorder p-6 rounded-2xl max-w-sm w-full text-center space-y-4 shadow-2xl">
            <span id="dialog-icon" class="text-4xl block">⚠️</span>
            <h3 id="dialog-title" class="font-oswald text-xl font-bold text-white uppercase tracking-wider">Dėmesio</h3>
            <p id="dialog-message" class="text-xs text-slate-300 leading-relaxed"></p>
            <div class="flex gap-3 pt-2">
                <button id="dialog-cancel-btn" class="flex-1 h-10 bg-tractorBg border border-tractorBorder text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition hidden">Atšaukti</button>
                <button id="dialog-confirm-btn" class="flex-1 h-10 bg-tractorPrimary hover:bg-tractorPrimaryHover text-white font-bold rounded-xl text-xs transition">Gerai</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
